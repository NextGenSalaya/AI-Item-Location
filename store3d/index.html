<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Makro AI Item Location | ศาลายา</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --red:#e60012;--red-dark:#b3000e;--red-soft:#fff0f1;--ink:#1d2330;--muted:#6b7280;--line:#ececf0;
  --bg:#f6f6f8;--card:#fff;--shadow:0 6px 24px rgba(20,24,40,.10);--panel-w:440px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
  font-family:"IBM Plex Sans Thai",system-ui,sans-serif;font-size:14px;overflow:hidden}
body{display:flex;flex-direction:column}
button{font:inherit;cursor:pointer;color:inherit}
/* ---- header (white, red brand, pill search) ---- */
header{background:#fff;position:relative;z-index:6;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.hrow{display:flex;align-items:center;gap:14px;padding:10px 20px}
.brand{display:flex;flex-direction:column;align-items:flex-start;line-height:1;flex:none;border:0;background:none;padding:0 4px 0 0}
.brand-word{font:bold 36px/1 Arial,sans-serif;letter-spacing:-2px;color:var(--red)}
.brand-sub{font:700 9px/1.8 Arial,sans-serif;letter-spacing:1.2px;color:#555960;margin-top:2px}
.store-chip{display:flex;align-items:center;gap:6px;border:1px solid #d9d9df;border-radius:22px;padding:0 14px;height:44px;background:#fff;white-space:nowrap;font-weight:500;flex:none}
.store-chip svg{color:var(--red)}
.search{flex:1;position:relative;min-width:0}
.search input{width:100%;height:44px;border-radius:22px;border:1px solid transparent;background:#f1f1f4;padding:0 118px 0 46px;font:inherit;font-size:15px;outline:none}
.search input:focus{border-color:var(--red);background:#fff}
.search > svg{position:absolute;left:16px;top:13px;color:var(--ink)}
.search .clear{width:28px;height:28px;border:0;border-radius:50%;background:transparent;color:var(--muted);display:none}
.hicon{position:relative;width:44px;height:44px;border:0;background:none;display:grid;place-items:center;border-radius:50%;flex:none}
.hicon:hover{background:#f4f4f6}
.badge{position:absolute;top:3px;right:1px;min-width:18px;height:18px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;font-weight:600;display:grid;place-items:center;padding:0 5px;border:2px solid #fff}
.badge:empty,.badge[data-n="0"]{display:none}
.navrow{display:flex;gap:6px;padding:0 20px;border-top:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.navrow button{border:0;background:none;padding:11px 12px;font-size:15px;font-weight:500;color:#3b3f4a;border-bottom:3px solid transparent;white-space:nowrap;display:flex;gap:6px;align-items:center}
.navrow button.on{color:var(--red);border-bottom-color:var(--red)}
/* ---- layout ---- */
.layout{display:flex;flex:1;min-height:0;position:relative}
aside{width:var(--panel-w);flex:none;background:var(--bg);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;z-index:4}
.panel-body{flex:1;overflow:auto;padding:16px}
.hint{color:var(--muted);font-size:13px;line-height:1.6}
h2.sec{font-size:17px;margin:20px 0 10px;display:flex;justify-content:space-between;align-items:baseline}
h2.sec:first-child{margin-top:4px}
h2.sec small{font-size:12.5px;color:var(--muted);font-weight:400}
h2.sec .more{border:0;background:none;color:var(--red);font-size:13px;font-weight:600;padding:0}
/* home */
.hero{background:radial-gradient(120% 140% at 100% 0,#ff4d5a 0,var(--red) 45%,#c4000f 100%);color:#fff;border-radius:20px;padding:20px;position:relative;overflow:hidden;display:flex;gap:10px;align-items:center;box-shadow:0 10px 24px rgba(230,0,18,.22)}
.hero-txt{flex:1;min-width:0;position:relative;z-index:1}
.hero .tag{display:inline-block;background:rgba(255,255,255,.2);border-radius:20px;padding:3px 10px;font-size:11.5px;font-weight:600;margin-bottom:8px}
.hero-art{position:relative;width:104px;height:110px;flex:none;z-index:1}
.hero-art span{position:absolute;width:52px;height:52px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:27px;box-shadow:0 6px 14px rgba(0,0,0,.18)}
.hero-art span:nth-child(1){left:0;top:4px}.hero-art span:nth-child(2){right:0;top:28px;width:60px;height:60px;font-size:31px}.hero-art span:nth-child(3){left:16px;bottom:0;width:44px;height:44px;font-size:22px}
.hero h3{margin:0 0 6px;font-size:22px;line-height:1.25}
.hero p{margin:0 0 12px;opacity:.92;font-size:13px;line-height:1.5}
.hero .btn{background:#fff;color:var(--red);border:0}
.hero:after{content:"";position:absolute;right:-40px;bottom:-60px;width:190px;height:190px;border-radius:50%;background:rgba(255,255,255,.10)}
.hero .btn{box-shadow:0 4px 12px rgba(0,0,0,.15)}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.quick button{border:0;background:#fff;border-radius:16px;padding:12px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:7px;font-size:12px;font-weight:500;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.quick button:hover{box-shadow:0 0 0 2px var(--red)}
.quick i{width:42px;height:42px;border-radius:14px;background:var(--red-soft);color:var(--red);display:grid;place-items:center}
.kits{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:10px}
.kit{background:var(--tint,#fff);border:0;border-radius:18px;padding:14px 8px 12px;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.05);transition:transform .15s}
.kit:hover{transform:translateY(-2px)}
.kit small{display:block;font-size:11.5px;color:var(--muted);margin-top:2px}
.kit:hover{box-shadow:0 0 0 2px var(--red)}
.kit .em{font-size:28px;width:54px;height:54px;border-radius:50%;background:#fff;display:grid;place-items:center;margin:0 auto 8px;box-shadow:0 3px 8px rgba(0,0,0,.08)}
.kit b{font-size:13.5px;font-weight:600}
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px 6px}
.cat{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12.5px;padding:0}
.cat .em{width:62px;height:62px;border-radius:50%;background:#fff;border:3px solid #fff;outline:1px solid #f0d6d8;display:grid;place-items:center;font-size:27px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.cat:hover .em{box-shadow:0 0 0 2px var(--red)}
.cat .em{overflow:hidden}
.cat .em img{width:78%;height:78%;object-fit:contain}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat div{background:#fff;border-radius:14px;padding:12px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.stat b{display:block;font-size:18px;color:var(--red)}
.stat span{font-size:11.5px;color:var(--muted)}
/* product cards (2-col grid) */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.pcard{background:#fff;border-radius:16px;transition:box-shadow .15s;padding:10px;display:flex;flex-direction:column;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.05);min-width:0}
.pcard:hover{box-shadow:0 6px 18px rgba(20,24,40,.10)}
.pcard.sel{box-shadow:0 0 0 2px var(--red)}
.pimg{position:relative;aspect-ratio:1;border-radius:10px;background:#f7f7f9;margin-bottom:8px;overflow:hidden}
.pimg img{width:100%;height:100%;object-fit:contain}
.pimg .ph{position:absolute;inset:0;display:grid;place-items:center;font-size:34px;opacity:.35}
.padd{position:absolute;right:6px;bottom:6px;width:36px;height:36px;border-radius:50%;border:0;background:var(--red);color:#fff;font-size:22px;line-height:1;display:grid;place-items:center;box-shadow:0 2px 6px rgba(230,0,18,.35)}
.padd.in{background:#fff;color:var(--red);box-shadow:0 0 0 2px var(--red)}
.pname{font-size:13.5px;line-height:1.4;height:2.8em;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;margin-bottom:8px}
.ploc{margin-top:auto;display:flex;border-radius:10px;overflow:hidden;color:#fff;background:var(--red)}
.ploc b{flex:1;padding:6px 9px;font-size:15px;line-height:1.15}
.ploc b small{display:block;font-size:10.5px;font-weight:400;opacity:.85}
.ploc span{background:var(--red-dark);padding:6px 9px;font-size:12.5px;font-weight:600;display:grid;place-items:center;clip-path:polygon(9px 0,100% 0,100% 100%,0 100%);padding-left:15px}
.ploc.none{background:#e9e9ee;color:var(--muted)}
.ploc.none b{font-size:12px;font-weight:500}
/* list rows (cart-like) */
.item{display:flex;gap:10px;padding:10px;border-radius:14px;margin-bottom:8px;background:#fff;cursor:pointer;align-items:center;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.item.sel{box-shadow:0 0 0 2px var(--red)}
.thumb{width:56px;height:56px;border-radius:10px;background:#f7f7f9;flex:none;object-fit:contain}
.item .t{flex:1;min-width:0}
.item .n{font-weight:500;line-height:1.35;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.loc{display:inline-flex;gap:6px;align-items:center;font-size:12px;color:var(--muted);margin-top:4px}
.loc b{background:var(--red);color:#fff;font-weight:600;border-radius:6px;padding:1px 7px}
.loc.none b{background:#e9e9ee;color:var(--muted)}
.add{width:34px;height:34px;border-radius:50%;border:0;background:var(--red);color:#fff;flex:none;display:grid;place-items:center;font-size:18px}
.add.in{background:#fff;color:var(--red);box-shadow:0 0 0 2px var(--red)}
.stopno{width:26px;height:26px;border-radius:50%;background:var(--ink);color:#fff;font-size:12px;font-weight:600;display:grid;place-items:center;flex:none}
/* product detail */
.detail{background:#fff;border-radius:16px;padding:14px;margin-bottom:16px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.detail .big{aspect-ratio:16/10;border-radius:12px;background:#f7f7f9;display:grid;place-items:center;overflow:hidden;margin-bottom:12px}
.detail .big img{width:100%;height:100%;object-fit:contain}
.detail h4{margin:0 0 10px;font-size:16px;line-height:1.4}
.detail .ploc{margin-bottom:10px}
.detail .ploc b{font-size:18px;padding:9px 12px}
.detail .ploc span{font-size:14px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:12.5px;color:var(--muted)}
.kv b{color:var(--ink);font-weight:500}
.shelf-viz{display:flex;flex-direction:column-reverse;gap:3px;width:52px;flex:none}
.shelf-viz i{height:9px;border-radius:2px;background:#e9e9ee}
.shelf-viz i.on{background:var(--red)}
.btns{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.btn{border:1px solid #d9d9df;background:#fff;border-radius:22px;padding:9px 16px;font-weight:600;display:inline-flex;gap:6px;align-items:center;justify-content:center}
.btn.primary{background:var(--red);border-color:var(--red);color:#fff}
.btn.wide{flex:1}
.btn:disabled{opacity:.5;cursor:default}
.back{border:0;background:none;color:var(--muted);padding:0;margin-bottom:10px;font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.chip{border:1px solid #d9d9df;background:#fff;border-radius:18px;padding:6px 13px;font-size:13px}
.chip:hover{border-color:var(--red);color:var(--red)}
.place{display:flex;gap:12px;align-items:center;justify-content:space-between;background:#fff1f1;border:1px solid #f5c6c8;border-radius:12px;padding:12px 14px;margin:0 0 12px}
.place b{display:block;font-size:15px}.place small{color:var(--muted);font-size:12.5px}
.res-head{display:flex;justify-content:space-between;align-items:baseline;margin:2px 0 10px}
.res-head h3{margin:0;font-size:16px}
.res-head span{color:var(--muted);font-size:12.5px}
.bay-group h5{margin:14px 0 8px;font-size:13px;color:var(--muted);font-weight:600}
.route-sum{background:#fff;border-radius:14px;padding:12px 14px;margin-bottom:10px;font-size:13.5px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.route-sum b{color:var(--red)}
.sticky-cta{position:sticky;bottom:-16px;margin:12px -16px -16px;padding:12px 16px;background:linear-gradient(transparent,var(--bg) 30%)}
.ai-input{width:100%;min-height:64px;resize:vertical;border:1px solid transparent;border-radius:14px;padding:12px 14px;font:inherit;outline:none;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.ai-input:focus{border-color:var(--red)}
.ai-box{border-radius:14px;padding:12px 14px;margin:12px 0;font-size:13.5px;line-height:1.6}
.ai-box.err{background:#fff4f4;border:1px solid #f6c7c9;color:#9b1c22}
.ai-box.sum{background:var(--red-soft)}
.ai-box.plain{background:#fff}
.ai-box code{background:#fff;border-radius:4px;padding:1px 5px;font-size:12px}
.ai-why{font-size:12.5px;color:var(--muted);margin:-4px 6px 12px 12px;line-height:1.5}
.ai-why b{color:var(--ink);font-weight:500}
.spin{display:inline-block;width:14px;height:14px;border:2px solid #f3a6a9;border-top-color:var(--red);border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
.modal{position:fixed;inset:0;background:rgba(20,22,30,.5);z-index:20;display:grid;place-items:center;padding:16px}
.modal[hidden]{display:none}
.modal .sheet{background:var(--bg);border-radius:18px;padding:16px;width:min(440px,100%)}
#scanVideo{width:100%;aspect-ratio:4/3;background:#111;border-radius:12px;object-fit:cover;display:block}
.sacts{position:absolute;right:6px;top:4px;display:flex;gap:2px;align-items:center}
.sacts .clear{position:static}
.sbtn{width:36px;height:36px;border:0;border-radius:50%;background:transparent;color:var(--ink);display:grid;place-items:center}
.sbtn:hover{background:#e6e6ea}
.sbtn.live{background:var(--red);color:#fff;animation:pulse 1s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(230,0,18,.2)}}
.fav-btn{width:44px;height:44px;border-radius:50%;border:1px solid #d9d9df;background:#fff;display:grid;place-items:center;flex:none}
.fav-btn.on{color:var(--red);border-color:var(--red)}
.fav-btn.on svg{fill:var(--red)}
.facts{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:12.5px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.facts span{color:var(--muted)}
.src{display:inline-block;margin-top:10px;font-size:12.5px;color:var(--red);font-weight:500;text-decoration:none}
.filter{display:flex;gap:6px;margin:-2px 0 12px}
.filter .chip.on{background:var(--red);border-color:var(--red);color:#fff}
.note{font-size:12px;color:var(--muted);line-height:1.6;margin-top:18px;padding:12px;background:#fff;border-radius:12px}

/* ---- splash, skeletons, motion ---- */
.splash{position:fixed;inset:0;z-index:50;background:radial-gradient(circle at 50% 35%,#ff3341,#e60012 55%,#b3000e);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;transition:opacity .45s}
.splash.hide{opacity:0;pointer-events:none}
.splash .brand-word{color:#fff;font-size:64px}
.splash .brand-sub{color:rgba(255,255,255,.85);font-size:13px;letter-spacing:2.5px}
.splash p{margin-top:28px;font-size:14px;opacity:.9}
.splash .spin{border-color:rgba(255,255,255,.35);border-top-color:#fff}
.pimg,.thumb,.detail .big{background:linear-gradient(100deg,#f2f2f5 30%,#e8e8ee 50%,#f2f2f5 70%);background-size:300% 100%;animation:shimmer 1.3s linear infinite}
@keyframes shimmer{from{background-position:100% 0}to{background-position:-100% 0}}
.pimg img,.detail .big img,.cat .em img,img.thumb{animation:fadein .35s ease both}
@keyframes fadein{from{opacity:0}}
.panel-body.enter>*{animation:rise .32s ease both}
.panel-body.enter>*:nth-child(2){animation-delay:.04s}.panel-body.enter>*:nth-child(3){animation-delay:.08s}
.panel-body.enter>*:nth-child(4){animation-delay:.12s}.panel-body.enter>*:nth-child(n+5){animation-delay:.16s}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
.badge.bump{animation:bump .45s cubic-bezier(.3,1.8,.5,1)}
@keyframes bump{40%{transform:scale(1.45)}}
.padd,.add,.btn,.kit,.cat,.quick button{transition:transform .12s}
.padd:active,.add:active,.btn:active,.kit:active,.cat:active,.quick button:active{transform:scale(.93)}
/* ---- walk mode card ---- */
.walk{display:none;position:absolute;left:50%;bottom:16px;transform:translateX(-50%);width:min(440px,calc(100% - 24px));background:#fff;border-radius:20px;box-shadow:0 12px 32px rgba(20,24,40,.22);padding:14px;z-index:4;animation:rise .3s ease both}
.walk.on{display:block}
.walk-top{display:flex;align-items:baseline;gap:10px}
.walk-top b{font-size:18px}.walk-top b small{font-size:13px;color:var(--muted);font-weight:500}
.walk-top span{color:var(--red);font-weight:600;font-size:13px}
.walk-x{margin-left:auto;border:0;background:#f1f1f4;width:30px;height:30px;border-radius:50%}
.walk-bar{height:6px;border-radius:3px;background:#f1f1f4;margin:10px 0 12px;overflow:hidden}
.walk-bar i{display:block;height:100%;background:var(--red);border-radius:3px;transition:width .4s}
.witem{display:flex;gap:10px;align-items:center;margin-bottom:8px}
.witem .thumb{width:50px;height:50px}
.witem b{display:block;font-size:14px;line-height:1.35}
.witem span{font-size:12.5px;color:var(--muted)}
.witem em{font-style:normal;background:var(--red);color:#fff;border-radius:6px;padding:1px 7px;font-weight:600;margin-right:4px}
.walk-done{text-align:center;padding:6px 4px}
.walk-done span{font-size:42px}.walk-done b{display:block;font-size:19px;margin:4px 0}
.walk-done p{color:var(--muted);margin:0 0 12px}
@media (max-width:760px){ .walk{bottom:12px} }

/* ---- shop starter page ---- */
.secbar{border-left:4px solid var(--red);padding-left:8px}
.shopmode{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.shopmode button{border:2px solid transparent;background:#fff;border-radius:16px;padding:12px;text-align:left;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.shopmode button b{display:block;font-size:14.5px}
.shopmode button small{color:var(--muted);font-size:12px}
.shopmode button.on{border-color:var(--red);background:var(--red-soft)}
.need{background:#fff;border-radius:16px;padding:12px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.need.off{opacity:.55;background:#f1f1f4;box-shadow:none}
.need.off .need-top b{text-decoration:line-through}
.need-top{display:flex;align-items:center;gap:8px}
.need-top b{font-size:15px}
.need-top .qty{background:var(--bg);border-radius:10px;padding:2px 9px;font-size:12px;font-weight:600;color:#3b3f4a}
.need-x{margin-left:auto;border:1px solid #d9d9df;background:#fff;border-radius:16px;padding:3px 11px;font-size:12px;color:var(--muted)}
.need-pick{display:flex;gap:10px;align-items:center;margin-top:10px}
.need-pick .t{flex:1;min-width:0}
.need-pick .n{font-weight:500;line-height:1.35}
.own{display:inline-block;background:var(--red);color:#fff;font-size:10.5px;font-weight:700;border-radius:5px;padding:0 6px;margin-right:6px;vertical-align:1px;letter-spacing:.2px}
.need-why{font-size:12.5px;color:var(--muted);margin-top:6px}
.need-more{border:0;background:none;color:var(--red);font-weight:600;font-size:13px;padding:6px 0 0}
.need-opts{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;border:1px solid var(--line);background:#fff;border-radius:12px;padding:9px 10px;font-size:13px}
.opt i{width:16px;height:16px;border-radius:50%;border:2px solid #c9ccd3;flex:none;margin-top:2px}
.opt.on{border-color:var(--red);background:var(--red-soft)}
.opt.on i{border-color:var(--red);box-shadow:inset 0 0 0 3px #fff;background:var(--red)}
.opt small{display:block;color:var(--muted);font-size:11.5px;margin-top:2px}

/* ---- categories ---- */
.cats{grid-template-columns:repeat(4,1fr)}
.catchips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:2px -16px 10px;padding:0 16px}
.catchips .chip{white-space:nowrap;flex:none}
.catchips .chip.on,.filter .chip.on{background:var(--red);border-color:var(--red);color:#fff}
.cathead{display:flex;align-items:center;gap:12px;margin:4px 0 12px}

.sub2.on{box-shadow:0 0 0 3px #1b1b1b}
.sub2c{border-top:1px solid var(--line,#e6e6e6);padding-top:12px}

.view{position:relative;flex:1;min-width:0}
#c{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.ctrl{position:absolute;top:12px;right:12px;display:flex;flex-direction:column;gap:6px}

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const store = { get(k, d){ try{ return JSON.parse(localStorage.getItem(k)) ?? d }catch{ return d } },
                set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)) }catch{} } };

// ---------- data ----------
const data = await fetch('data/store.json', { cache: 'no-cache' }).then(r => r.json());
const [MW, MH] = data.size;
const CX = 700, CY = 870;                       // centre of the sales floor (map units)
const norm = s => s.toLowerCase().replace(/[็-์]/g, '').replace(/\s+/g, ' ');   // Thai tone-mark order varies in the data
const W = (x, y) => new THREE.Vector3(x - CX, 0, y - CY);
const items = data.items.map(([no, desc, bc, loc, bay, shelf, cat, sub, sub2], i) =>
  ({ i, no, desc, bc, loc, bay, shelf, cat, sub, sub2, lc: norm(desc) }));
const bayKeys = Object.keys(data.bays);
const bayItems = new Map();
for (const it of items) if (it.bay) (bayItems.get(it.bay) || bayItems.set(it.bay, []).get(it.bay)).push(it);
let thumbs = {};

// fixture pieces: [cx, cy, ang, len, depth, bayKey|""] — gondola bays, or cells traced from the drawing
const pieces = data.pieces;
const bayPieces = new Map();
pieces.forEach((pc, i) => { if (pc[5]) (bayPieces.get(pc[5]) || bayPieces.set(pc[5], []).get(pc[5])).push(i); });
const bayCenter = k => {
  const ids = bayPieces.get(k);
  if (!ids) return data.bays[k].slice(0, 2);
  return [ids.reduce((s, i) => s + pieces[i][0], 0) / ids.length, ids.reduce((s, i) => s + pieces[i][1], 0) / ids.length];
};

const aisleOf = k => k.split('-')[0];
const zone = a => { const n = +a; return n >= 500 && n < 600 ? 'cold' : n >= 600 && n < 700 ? 'fresh' : 'dry'; };
const bayH = k => ({ cold: 12, fresh: 9, dry: 18 })[zone(aisleOf(k))];
const pieceH = pc => pc[5] ? bayH(pc[5]) : 8;
const LEVELS = 6;

// ---------- scene ----------
const canvas = $('#c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene();
scene.background = new THREE.Color('#eef0f4');
scene.fog = new THREE.Fog('#eef0f4', 1400, 2600);
const camera = new THREE.PerspectiveCamera(45, 1, 1, 5000);
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.maxPolarAngle = Math.PI * 0.47;
controls.minDistance = 25; controls.maxDistance = 1600;
controls.screenSpacePanning = false;

scene.add(new THREE.HemisphereLight('#ffffff', '#c9cdd6', 1.6));
const sun = new THREE.DirectionalLight('#ffffff', 1.4);
sun.position.set(-300, 600, 250);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -520, right: 520, top: 520, bottom: -520, near: 100, far: 1500 });
sun.shadow.bias = -0.0005;
scene.add(sun);

// floor = the real floor-plan drawing
const tex = await new THREE.TextureLoader().loadAsync(`data/floor.png?v=${data.version}`);
tex.colorSpace = THREE.SRGBColorSpace;
tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
const floor = new THREE.Mesh(new THREE.PlaneGeometry(MW, MH),
  new THREE.MeshStandardMaterial({ map: tex, roughness: 1 }));
floor.rotation.x = -Math.PI / 2;
floor.position.set(MW / 2 - CX, 0, MH / 2 - CY);
floor.receiveShadow = true;
scene.add(floor);

// shelves: one instanced box per fixture piece
const tmpM = new THREE.Matrix4(), tmpQ = new THREE.Quaternion(), tmpS = new THREE.Vector3(), up = new THREE.Vector3(0, 1, 0);
function pieceTransform(i, h, grow = 0) {
  const [x, y, ang, len, depth] = pieces[i];
  const p = W(x, y); p.y = h / 2;
  tmpQ.setFromAxisAngle(up, -ang);
  tmpS.set(len + grow, h, depth + grow);
  return { p, q: tmpQ.clone(), s: tmpS.clone() };
}
const aisleColor = a => {
  const z = zone(a), n = +a;
  if (z === 'cold') return new THREE.Color().setHSL(0.56 + (n % 7) * 0.006, 0.5, 0.66);
  if (z === 'fresh') return new THREE.Color().setHSL(0.38, 0.35, 0.66);
  return new THREE.Color().setHSL(0.08 + (n % 9) * 0.012, 0.36, 0.70);
};
const shelfMesh = new THREE.InstancedMesh(new THREE.BoxGeometry(1, 1, 1),
  new THREE.MeshStandardMaterial({ roughness: 0.75 }), pieces.length);
shelfMesh.castShadow = shelfMesh.receiveShadow = true;
const baseColors = [];
pieces.forEach((pc, i) => {
  const { p, q, s } = pieceTransform(i, pieceH(pc));
  shelfMesh.setMatrixAt(i, tmpM.compose(p, q, s));
  const k = pc[5], c = k ? aisleColor(aisleOf(k)) : new THREE.Color('#c9ccd3');   // grey = no location code
  if (k && !bayItems.has(k)) c.offsetHSL(0, -0.25, 0.08);                         // empty bays look washed out
  baseColors.push(c); shelfMesh.setColorAt(i, c);
});
scene.add(shelfMesh);

let levelLines;
const aisleSprites = [], signSprites = [];
// shelf levels: thin lines around each piece so the 6 shelves read in 3D
{
  const pos = [];
  pieces.forEach(pc => {
    if (!pc[5]) return;
    const h = pieceH(pc), [x, y, ang, len, depth] = pc, c = W(x, y);
    const ax = Math.cos(ang), az = Math.sin(ang), hl = len / 2 + 0.05, hd = depth / 2 + 0.05;
    const corner = (a, b) => [c.x + ax * a * hl - az * b * hd, c.z + az * a * hl + ax * b * hd];
    const ring = [corner(-1, -1), corner(1, -1), corner(1, 1), corner(-1, 1)];
    for (let l = 1; l < LEVELS; l++) {
      const yy = h * l / LEVELS;
      for (let e = 0; e < 4; e++) { const a = ring[e], b = ring[(e + 1) % 4]; pos.push(a[0], yy, a[1], b[0], yy, b[1]); }
    }
  });
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  levelLines = new THREE.LineSegments(g, new THREE.LineBasicMaterial({ color: '#000', transparent: true, opacity: 0.13 }));
  scene.add(levelLines);
}

// aisle number labels
await document.fonts.ready;
function textSprite(text, { bg = '#ffffff', fg = '#1d2330', scale = 1, bold = 600, onTop = true } = {}) {
  const c = document.createElement('canvas'), ctx = c.getContext('2d'), f = 44;
  ctx.font = `${bold} ${f}px "IBM Plex Sans Thai"`;
  const w = Math.ceil(ctx.measureText(text).width) + 36;
  c.width = w; c.height = 72;
  ctx.font = `${bold} ${f}px "IBM Plex Sans Thai"`;
  ctx.fillStyle = bg; ctx.beginPath(); ctx.roundRect(2, 2, w - 4, 68, 18); ctx.fill();
  ctx.fillStyle = fg; ctx.textBaseline = 'middle'; ctx.textAlign = 'center'; ctx.fillText(text, w / 2, 38);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4;
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: t, depthTest: !onTop, transparent: true }));
  s.scale.set(w / 72 * 9 * scale, 9 * scale, 1); s.renderOrder = 10;
  return s;
}
{
  const groups = {};
  bayKeys.forEach(k => (groups[aisleOf(k)] ||= []).push(data.bays[k]));
  for (const [a, pts] of Object.entries(groups)) {
    const top = pts.reduce((m, p) => p[1] < m[1] ? p : m);           // north end of the aisle
    const s = textSprite(a, { scale: 0.8, onTop: false });
    const p = W(top[0], top[1]); s.position.set(p.x, bayH(a + '-1') + 7, p.z - 6);
    scene.add(s); aisleSprites.push(s);
    // realistic look: red Makro-style aisle sign hanging over the head of the aisle
    const sign = textSprite(a, { bg: '#e60012', fg: '#ffffff', scale: 1.25, bold: 700, onTop: false });
    sign.position.set(p.x, bayH(a + '-1') + 15, p.z - 4); sign.visible = false;
    scene.add(sign); signSprites.push(sign);
  }
  const e = W(...data.entrance), ent = textSprite('ทางเข้า', { bg: '#1d2330', fg: '#fff', scale: 1.3 });
  ent.position.set(e.x, 16, e.z); scene.add(ent);
  const ring = new THREE.Mesh(new THREE.RingGeometry(6, 9, 40), new THREE.MeshBasicMaterial({ color: '#1d2330' }));

function drawRoute(stops) {        // stops: bay keys in visiting order
  clearGroup(routeGroup); ants = null; antCurve = null;

  if (v.length < 2) return null;

async function runAI() {
  const text = ai.text.trim();
  if (!text || ai.loading) return toast('เลือกหรือพิมพ์ประเภทร้านก่อน');
  Object.assign(ai, { loading: true, t0: performance.now(), result: null, error: null, setup: false, open: null });
  render();
  const tick = setInterval(() => { const s = $('#aiSec'); if (s) s.textContent = Math.round((performance.now() - ai.t0) / 1000); }, 1000);
  try {
    const res = await fetch('/api/plan', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ request: text, shop: ai.shop }) });
    const out = await res.json().catch(() => ({ error: 'เซิร์ฟเวอร์ตอบกลับผิดรูปแบบ' }));
    if (!res.ok) { ai.error = out.error || `ผิดพลาด (${res.status})`; ai.setup = !!out.setup; return; }
    out.needs.forEach(n => { n.sel = 0; n.off = false; });
    ai.result = out;
    applyPlan();
    if (!out.needs.length) ai.error = 'ไม่พบสินค้าที่ตรงกับคำขอในสาขานี้';
  } catch {
    ai.error = 'ติดต่อเซิร์ฟเวอร์ไม่ได้ ตรวจว่าเปิดด้วย python store3d/serve.py';
  } finally {
    clearInterval(tick); ai.loading = false; state.tab = 'ai'; render();
    $('#aiResult')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
}
function routeList() {
  const its = state.list.map(k => byNo.get(k)).filter(it => it?.bay);
  if (!its.length) return toast('ไม่มีสินค้าที่มีพิกัดบนผัง');
  const order = orderStops(its.map(it => it.bay));
  clearGroup(markGroup);
  order.forEach((k, i) => pin(k, `${i + 1} · ${k}`, its.find(it => it.bay === k).shelf));
  state.routeOrder = order; routeTo(order, true);
}

const walkRing = new THREE.Mesh(new THREE.RingGeometry(10, 13.5, 48), new THREE.MeshBasicMaterial({ color: '#e60012', transparent: true, opacity: .9 }));

}

  state.walk.i = i;
  const k = state.routeOrder[i];
  if (k) {
    const [x, y] = bayCenter(k), p = W(x, y);
    walkRing.position.set(p.x, 0.5, p.z); walkRing.visible = true;
    focusBay(k);
  } else { walkRing.visible = false; home(); }

}
function endWalk() { state.walk = null; walkRing.visible = false; render(); }
function renderWalk() {
  const c = $('#walkCard'), w = state.walk;
  if (!w) { c.classList.remove('on'); c.innerHTML = ''; return; }
  const order = state.routeOrder, n = order.length, i = w.i;
  let html;
  if (i >= n) html = `<div class="walk-done"><span>🎉</span><b>หยิบครบ ${n} จุดแล้ว</b><p>เดินไปชำระเงินที่แคชเชียร์ด้านหน้าร้านได้เลย</p>

    html = `<div class="walk-top"><b>จุดที่ ${i + 1} <small>จาก ${n}</small></b><span>ช่อง ${esc(order[i])}</span>

      ${its.map(it => `<div class="witem">${img(it)}<div><b>${esc(it.desc)}</b><span><em>${esc(it.loc)}</em> ชั้น ${it.shelf} นับจากล่าง</span></div></div>`).join('')}

        <button class="btn primary wide" data-walk="next">หยิบแล้ว ✓ ${i === n - 1 ? 'เสร็จ' : 'ถัดไป ›'}</button></div>`;

    <button class="btn" data-nav="back">รายละเอียด</button>`;
  else if (state.routeInfo) html = `<div class="t"><b>เส้นทาง ${state.routeOrder.length} จุดแวะ</b>ระยะเดินประมาณ ${Math.round(state.routeInfo.metres)} ม.</div>
    <button class="btn primary" data-walk="start">เดินทีละจุด</button>`;
  c.innerHTML = html; c.classList.toggle('on', !!html);
}

function select(it) {
  state.sel = it; state.bay = null; state.route = null; state.routeInfo = null;
  clearGroup(markGroup); clearGroup(routeGroup); ants = null;
  if (it.bay) { pin(it.bay, `${it.loc} · ชั้น ${it.shelf}`, it.shelf); focusBay(it.bay); }
  else toast('สินค้านี้ยังไม่มีพิกัดบนผัง');
  state.tab = 'search'; render(); $('#body').scrollTop = 0;
}
function openBay(k) {
  state.bay = k; state.sel = null; state.tab = 'search';
  clearGroup(markGroup); pin(k, `ช่อง ${k}`, 0); focusBay(k); render(); $('#body').scrollTop = 0;
}
function routeTo(keys, info) {
  const r = drawRoute(keys);
  if (!r) return toast('หาเส้นทางไม่พบ');
  toast(`ระยะเดินประมาณ ${Math.round(r.metres)} เมตร`);
  if (info) { state.routeInfo = r; }
  setSeg('3d');
  const box = new THREE.Box3().setFromObject(routeGroup), c = box.getCenter(new THREE.Vector3()), sz = box.getSize(new THREE.Vector3());
  flyTo(c.setY(0), new THREE.Vector3(-0.2, 0.9, 0.8).multiplyScalar(Math.max(260, Math.max(sz.x, sz.z) * 1.2)));
}
function walkDist(from) {                    // walking distance (cells) from one cell to every cell, BFS on the grid
  const N = G.w * G.h, dist = new Int32Array(N).fill(1e9), q = new Int32Array(N);
  const s = from[1] * G.w + from[0]; let h = 0, t = 0; dist[s] = 0; q[t++] = s;
  while (h < t) {
    const u = q[h++], ux = u % G.w, uy = u / G.w | 0;
    for (const v of [ux + 1 < G.w ? u + 1 : -1, ux > 0 ? u - 1 : -1, uy + 1 < G.h ? u + G.w : -1, uy > 0 ? u - G.w : -1]) {
      if (v < 0 || G.block[v] || dist[v] <= dist[u] + 1) continue;
      dist[v] = dist[u] + 1; q[t++] = v;
    }
  }
  return dist;
}
function orderStops(keys) {                 // nearest-neighbour from the entrance
  const left = [...new Set(keys)], out = []; let [cx, cy] = data.entrance;
  while (left.length) {
    let bi = 0, bd = Infinity;
    left.forEach((k, i) => { const d = Math.hypot(data.bays[k][0] - cx, data.bays[k][1] - cy); if (d < bd) { bd = d; bi = i; } });
    const k = left.splice(bi, 1)[0]; out.push(k); [cx, cy] = data.bays[k];
  }
  // 2-opt on real walking distances: reverse stretches of the tour while that shortens it
  const cells = [nearestFree(...data.entrance), ...out.map(bayGoal)];
  const W2 = cells.map(c => walkDist(c));
  const idx = cells.map(c => c[1] * G.w + c[0]);
  const P = cells.map((_, i) => i);
  const d = (a, b) => W2[P[a]][idx[P[b]]];
  let better = true;
  while (better) {
    better = false;
    for (let i = 1; i < P.length - 1; i++) for (let j = i + 1; j < P.length; j++) {
      const after = j + 1 < P.length ? d(i, j + 1) - d(j, j + 1) : 0;
      if (d(i - 1, j) - d(i - 1, i) + after < -1e-6) {
        P.splice(i, j - i + 1, ...P.slice(i, j + 1).reverse());
        out.splice(i - 1, j - i + 1, ...out.slice(i - 1, j).reverse());
        better = true;
      }
    }
  }
  return out;
}
function toggleList(k) {
  const i = state.list.indexOf(k);
  if (i >= 0) { state.list.splice(i, 1); toast('นำออกจากรายการแล้ว'); } else { state.list.push(k); toast('เพิ่มลงรายการซื้อแล้ว'); }
  store.set('store3d-list', state.list); state.routeInfo = null; render();
}
function enter() { const b = $('#body'); b.classList.remove('enter'); void b.offsetWidth; b.classList.add('enter'); }
function nav(to) {
  if (to === 'map') return showMap(true);
  if (to !== 'back') {
    state.tab = to;
    if (to === 'search') { state.sel = null; state.bay = null; state.cat = null; state.q = ''; state.qcat = null; $('#q').value = ''; $('#qclear').style.display = 'none'; }
  }
  document.body.classList.remove('show-map'); requestAnimationFrame(resize);
  render(); if (to !== 'back') { $('#body').scrollTop = 0; enter(); }
}

document.addEventListener('click', e => {
  const n = e.target.closest('[data-nav]');
  if (n) return nav(n.dataset.nav);
  const wk = e.target.closest('[data-walk]')?.dataset.walk;
  if (wk === 'start') return startWalk();
  if (wk === 'close') return endWalk();
  if (wk === 'prev') return goStep(Math.max(0, state.walk.i - 1));
  if (wk === 'next') return goStep(state.walk.i + 1);
  const sm = e.target.closest('[data-shop]')?.dataset.shop;
  if (sm) { ai.shop = sm; if (ai.result && ai.text) return runAI(); return render(); }
  const opt = e.target.closest('[data-opt]');
  if (opt) { const n = ai.result.needs[+opt.dataset.need]; n.sel = +opt.dataset.opt; ai.open = null; applyPlan(); return render(); }
  const off = e.target.closest('[data-need-off]');
  if (off) { const n = ai.result.needs[+off.dataset.needOff]; n.off = !n.off; applyPlan(); return render(); }
  const more = e.target.closest('[data-need-open]');
  if (more) { const i = +more.dataset.needOpen; ai.open = ai.open === i ? null : i; return render(); }
  const qa = e.target.closest('[data-quick]')?.dataset.quick;
  if (qa === 'scan') return $('#scanBtn').click();
  if (qa === 'mic') return $('#micBtn').click();
  if (qa === 'map') { if (isPhone()) return showMap(true); return home(); }
  const kit = e.target.closest('[data-kit]');
  if (kit) { ai.text = kit.dataset.kit; state.tab = 'ai'; return runAI(); }
});
$('#body').addEventListener('click', e => {
  const add = e.target.closest('[data-add]');
  if (add) { e.stopPropagation(); return toggleList(add.dataset.add); }
  const fav = e.target.closest('[data-fav]');
  if (fav) { const k = fav.dataset.fav, i = state.fav.indexOf(k);
    if (i >= 0) { state.fav.splice(i, 1); toast('นำออกจากรายการโปรดแล้ว'); } else { state.fav.push(k); toast('เพิ่มในรายการโปรดแล้ว ♥'); }
    store.set('store3d-fav', state.fav); return render(); }
  const flt = e.target.closest('[data-filter]');
  if (flt) { state.onlyMapped = flt.dataset.filter === '1'; return render(); }
  if (e.target.closest('[data-act="favToList"]')) {
    state.fav.forEach(k => { if (!state.list.includes(k)) state.list.push(k); });
    store.set('store3d-list', state.list); state.routeInfo = null; toast('ใส่ลงรายการซื้อแล้ว'); return nav('list'); }
  const cc = e.target.closest('[data-cat]');
  const sb = e.target.closest('[data-sub]');
  if (sb) { state.sub = sb.dataset.sub === '' ? null : +sb.dataset.sub; state.sub2 = null; state.catN = 40; return render(); }
  const s2 = e.target.closest('[data-sub2]');
  if (s2) { state.sub2 = state.sub2 === +s2.dataset.sub2 ? null : +s2.dataset.sub2; state.catN = 40; return render(); }
  if (cc) { state.cat = +cc.dataset.cat; state.catN = 40; state.sub = null; state.sub2 = null; state.q = ''; $('#q').value = ''; $('#qclear').style.display = 'none';
    state.sel = null; state.bay = null; state.tab = 'search'; render(); $('#body').scrollTop = 0; return; }
  const qc = e.target.closest('[data-qcat]');
  if (qc) { state.qcat = qc.dataset.qcat === '' ? null : +qc.dataset.qcat; return render(); }
  if (e.target.closest('[data-act="more"]')) { state.catN = (state.catN || 40) + 40; return render(); }
  const chip = e.target.closest('[data-q]');
  if (chip) { $('#q').value = chip.dataset.q; return onQuery(); }
  const act = e.target.closest('[data-act]')?.dataset.act;
  if (act === 'gocs') { clearGroup(markGroup); routeTo(['CS']); if (isPhone()) showMap(true); return; }
  if (act === 'route') { routeTo([state.sel.bay]); if (isPhone()) showMap(true); return; }
  if (act === 'showmap') return showMap(true);
  if (act === 'eye') { setSeg('eye'); focusBay(state.sel.bay, 'eye'); if (isPhone()) showMap(true); return; }
  if (act === 'bay') return openBay(state.sel.bay);
  if (act === 'unsel') { state.sel = null; clearGroup(markGroup); clearGroup(routeGroup); ants = null; return render(); }
  if (act === 'back') { state.bay = null; clearGroup(markGroup); if (state.sel?.bay) pin(state.sel.bay, `${state.sel.loc} · ชั้น ${state.sel.shelf}`, state.sel.shelf); return render(); }
  if (act === 'routeBay') { routeTo([state.bay]); if (isPhone()) showMap(true); return; }
  if (act === 'clearList') { state.walk = null; walkRing.visible = false; state.list = []; store.set('store3d-list', []); state.routeInfo = null; clearGroup(routeGroup); clearGroup(markGroup); ants = null; return render(); }
  if (act === 'routeAll') { if (!state.routeInfo) routeList(); if (isPhone()) return showMap(true); return render(); }
  if (act === 'aiRun') return runAI();
  if (e.target.closest('.need')) return;
  const card = e.target.closest('.item, .pcard');
  if (card) { const it = byNo.get(card.dataset.k); if (it) select(it); }
});
let qT;
function onQuery() {
  state.q = $('#q').value; state.sel = null; state.bay = null; state.tab = 'search'; state.qcat = null;
  if (state.q) state.cat = null;
  $('#qclear').style.display = state.q ? 'block' : 'none';
  if (mapShown()) document.body.classList.remove('show-map');
  render(); $('#body').scrollTop = 0;
}
$('#q').addEventListener('input', () => { clearTimeout(qT); qT = setTimeout(onQuery, 160); });
$('#q').addEventListener('keydown', e => { if (e.key === 'Enter') { clearTimeout(qT); onQuery(); e.target.blur(); } });
$('#qclear').onclick = () => { $('#q').value = ''; onQuery(); $('#q').focus(); };

// voice search (Chrome / Edge, Thai)
let rec = null;
$('#micBtn').onclick = () => {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) return toast('เบราว์เซอร์นี้ยังค้นหาด้วยเสียงไม่ได้ ลองใช้ Chrome');
  if (rec) { rec.abort(); return; }
  rec = new SR(); rec.lang = 'th-TH'; rec.interimResults = true;
  $('#micBtn').classList.add('live'); toast('พูดชื่อสินค้าได้เลย…');
  rec.onresult = e => { $('#q').value = [...e.results].map(r => r[0].transcript).join(''); if (e.results[e.results.length - 1].isFinal) onQuery(); };
  rec.onerror = e => toast(e.error === 'not-allowed' ? 'กรุณาอนุญาตให้ใช้ไมโครโฟน' : 'ฟังไม่ชัด ลองใหม่อีกครั้ง');
  rec.onend = () => { rec = null; $('#micBtn').classList.remove('live'); };
  rec.start();
};

// barcode scanning: camera + BarcodeDetector where the browser has it, typed barcode otherwise
let scanStream = null, scanTimer = null;
function closeScan() {
  clearInterval(scanTimer); scanTimer = null;
  scanStream?.getTracks().forEach(t => t.stop()); scanStream = null;
  $('#scanModal').hidden = true;
}
function findBarcode(code) {
  code = code.trim(); if (!code) return;
  closeScan();
  $('#q').value = code; onQuery();
  const hits = search(code);
  if (hits.length === 1) select(hits[0]);
  else if (!hits.length) toast('ไม่พบสินค้าที่มีบาร์โค้ดนี้ในสาขา');
}
$('#scanBtn').onclick = async () => {
  $('#scanModal').hidden = false; $('#scanInput').value = '';
  const msg = $('#scanMsg'), video = $('#scanVideo');
  if (!('BarcodeDetector' in window) || !navigator.mediaDevices?.getUserMedia) {
    video.style.display = 'none';
    msg.textContent = 'เบราว์เซอร์นี้ยังสแกนด้วยกล้องไม่ได้ (ใช้ได้ใน Chrome บนมือถือ Android) พิมพ์เลขบาร์โค้ดด้านล่างแทนได้';
    return $('#scanInput').focus();
  }
  video.style.display = ''; msg.textContent = 'เล็งกล้องไปที่บาร์โค้ดของสินค้า';
  try {
    scanStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
    video.srcObject = scanStream; await video.play();
    const det = new BarcodeDetector({ formats: ['ean_13', 'ean_8', 'upc_a', 'upc_e', 'code_128', 'itf'] });
    scanTimer = setInterval(async () => {
      const codes = await det.detect(video).catch(() => []);
      if (codes.length) findBarcode(codes[0].rawValue);
    }, 300);
  } catch {
    video.style.display = 'none';
    msg.textContent = 'เปิดกล้องไม่ได้ กรุณาอนุญาตให้ใช้กล้อง หรือพิมพ์เลขบาร์โค้ดด้านล่าง';
  }
};
$('#scanClose').onclick = closeScan;
$('#scanModal').onclick = e => { if (e.target.id === 'scanModal') closeScan(); };
$('#scanGo').onclick = () => findBarcode($('#scanInput').value);
$('#scanInput').onkeydown = e => { if (e.key === 'Enter') findBarcode(e.target.value); };

// ---------- loop ----------
function resize() {
  const r = canvas.parentElement.getBoundingClientRect();
  renderer.setSize(r.width, r.height, false); camera.aspect = r.width / r.height; camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(canvas.parentElement); resize();
camera.position.set(-120, 620, 650); controls.target.copy(HOME_T);
const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const dummy = new THREE.Object3D();
function easeOutBounce(x) {                 // pins drop in and bounce
  const n = 7.5625, d = 2.75;
  if (x < 1 / d) return n * x * x;
  if (x < 2 / d) return n * (x -= 1.5 / d) * x + 0.75;
  if (x < 2.5 / d) return n * (x -= 2.25 / d) * x + 0.9375;
  return n * (x -= 2.625 / d) * x + 0.984375;
}
renderer.setAnimationLoop(now => {
  if (fly) {
    const t = Math.min(1, (now - fly.t0) / fly.ms), k = ease(t);
    controls.target.lerpVectors(fly.fromT, fly.toT, k); camera.position.lerpVectors(fly.fromP, fly.toP, k);
    if (t === 1) fly = null;
  }
  controls.update();
  markGroup.children.forEach(o => {
    if (o.userData.pulse) o.material.opacity = 0.55 + 0.35 * Math.sin(now / 220);
    if (o.userData.bob !== undefined) {
      o.userData.y0 ??= o.position.y;
      const bounce = easeOutBounce(Math.max(0, Math.min(1, (now - (o.userData.drop || 0)) / 650)));
      o.position.y = o.userData.y0 + Math.sin(now / 400 + o.userData.bob) * 1.5 + (1 - bounce) * 40;
    }
  });
  if (ants && antCurve) {
    for (let i = 0; i < ants.count; i++) {
      dummy.position.copy(antCurve.getPointAt(((i / ants.count) + now / 9000) % 1)); dummy.position.y = 2.2;
      dummy.updateMatrix(); ants.setMatrixAt(i, dummy.matrix);
    }
    ants.instanceMatrix.needsUpdate = true;
  }
  if (walkRing.visible) { const s = 1 + 0.12 * Math.sin(now / 250); walkRing.scale.set(s, s, s); }
  renderer.render(scene, camera);
});
$('#loading').classList.add('hide'); setTimeout(() => $('#loading').remove(), 500);
render();
setLook(store.get('store3d-look', 'real') === 'real');

// thumbnails & full titles load in the background
fetch('data/thumbs.json').then(r => r.json()).then(t => { thumbs = t; render(); }).catch(() => {});
</script>
